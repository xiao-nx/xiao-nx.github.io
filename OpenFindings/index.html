<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网页</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fa; color: #333; text-align: center; }
    header { background: #2563eb; color: white; padding: 40px 20px; }
    main { max-width: 700px; margin: 60px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px #00000010; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header><h1>欢迎来到我的网站</h1><p>一个简单的 HTML 网页示例</p></header>
  <main><h2>Hello World!</h2><p>这是我创建的第一个网页。</p><button onclick="sayHello()">点击这里</button></main>
  <script>function sayHello() { alert('你好！欢迎访问我的网页！'); }</script>
</body>
</html>
